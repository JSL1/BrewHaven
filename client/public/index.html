<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- BrewHaven logo for the browser tab -->
    <link
      rel="icon"
      href="%PUBLIC_URL%/images/brewhaven-logo.png"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="theme-color"
      content="#6f4e37"
    />

    <meta
      name="description"
      content="BrewHaven Coffee Shop"
    />

    <!--
      manifest.json provides metadata used when the website
      is installed on a mobile device or desktop.
    -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!--
      %PUBLIC_URL% points to the public folder.
      Files inside public can be referenced from this file.
    -->

    <title>BrewHaven</title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run BrewHaven.
    </noscript>

    <div id="root"></div>

    <!--
      This HTML file is used as the main template for the website.

      The React application will be loaded inside the root div.

      To run the website during development, use npm start.
      To make a production build, use npm run build.
    -->
  </body>
</html>
