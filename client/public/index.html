<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!--
      The favicon is removed here so the default React icon is not shown.
      A BrewHaven favicon can be added later if needed.
    -->

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#6f4e37" />

    <meta
      name="description"
      content="BrewHaven coffee shop website"
    />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop.
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Notice the use of %PUBLIC_URL% in the tag above.
      It will be replaced with the URL of the public folder during the build.
      Only files inside the public folder can be referenced from this HTML.

      This helps the website work correctly with client-side routing and
      when the website is deployed.
    -->

    <title>BrewHaven</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run BrewHaven.</noscript>

    <div id="root"></div>

    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the body tag.

      To begin development, run npm start.
      To create a production bundle, use npm run build.
    -->
  </body>
</html>
